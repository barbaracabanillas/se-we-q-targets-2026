<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SE WE Q Targets 2026 – All Countries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--g:#2A9C64;--dg:#0C2C1C;--white:#fff;--black:#000;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#fff;color:#000;font-size:14px;}
/* Header */
.header{background:var(--dg);color:#fff;padding:20px 28px 16px;}
.header h1{font-size:24px;font-weight:800;letter-spacing:-.3px;}
.header .subtitle{font-size:12px;font-weight:500;opacity:.7;margin-top:4px;}
.header .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;}
.chip.green{background:var(--g);border-color:var(--g);}
/* Filter bar */
.filterbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:2px solid var(--dg);padding:10px 28px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
.fb-group{display:flex;align-items:center;gap:6px;}
.fb-label{font-size:11px;font-weight:600;color:var(--dg);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
select{border:1.5px solid #ccc;border-radius:6px;padding:5px 10px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;background:#fff;color:#000;cursor:pointer;outline:none;}
select:focus{border-color:var(--g);}
select:disabled{opacity:.4;cursor:not-allowed;}
.pills{display:flex;gap:4px;}
.pill{border:1.5px solid #ccc;background:#fff;border-radius:20px;padding:5px 14px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:#555;transition:all .15s;}
.pill:hover{border-color:var(--g);color:var(--g);}
.pill.active{background:var(--dg);border-color:var(--dg);color:#fff;}
.pill.compare-active{background:var(--g);border-color:var(--g);color:#fff;}
.pill.metric-active{background:var(--dg);border-color:var(--dg);color:#fff;}
.divider{width:1px;height:28px;background:#ddd;}
/* Main content */
.main{padding:20px 28px 40px;}
/* KPI cards */
.kpi-row{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
.kpi-card{flex:1;min-width:160px;border:1.5px solid #e5e5e5;border-radius:10px;padding:16px;background:#fff;}
.kpi-card.hidden{display:none;}
.kpi-name{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#666;margin-bottom:8px;}
.kpi-val{font-size:22px;font-weight:800;color:var(--dg);}
.kpi-compare{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.kpi-a{font-size:14px;font-weight:600;color:var(--dg);}
.kpi-b{font-size:14px;font-weight:600;color:var(--g);}
.kpi-delta{font-size:13px;font-weight:700;padding:2px 8px;border-radius:12px;}
.kpi-delta.pos{background:#e8f7f0;color:#1a7a4a;}
.kpi-delta.neg{background:#f5f5f5;color:#555;}
/* Charts */
.charts{display:flex;flex-direction:column;gap:16px;margin-bottom:28px;}
.chart-row{display:flex;gap:16px;}
.chart-box{border:1.5px solid #e5e5e5;border-radius:10px;padding:16px;background:#fff;flex:1;min-width:0;}
.chart-box.full{flex:none;width:100%;}
.chart-box.hidden{display:none;}
.chart-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--dg);margin-bottom:12px;}
.chart-wrap{position:relative;height:220px;}
/* Table */
.table-section{}
.table-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.table-title{font-size:14px;font-weight:700;color:var(--dg);}
.view-pills{display:flex;gap:4px;}
.view-pill{border:1.5px solid #ccc;background:#fff;border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;cursor:pointer;color:#555;}
.view-pill.active{background:var(--dg);border-color:var(--dg);color:#fff;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:var(--dg);color:#fff;font-weight:600;padding:8px 10px;text-align:right;white-space:nowrap;position:sticky;top:0;}
th:first-child{text-align:left;}
td{padding:7px 10px;border-bottom:1px solid #f0f0f0;text-align:right;white-space:nowrap;}
td:first-child{text-align:left;font-weight:600;}
tr:hover td{background:#f8fdf9;}
tr.total-row td{background:#f0f9f4;font-weight:700;border-top:2px solid var(--g);}
.delta-pos{color:#1a7a4a;font-weight:700;}
.delta-neg{color:#888;font-weight:600;}
.th-a{background:#1a4d30;}
.th-b{background:#2A9C64;color:#fff;}
.th-d{background:#444;color:#fff;}

/* File status indicator */
.file-status{display:flex;align-items:center;gap:7px;cursor:pointer;padding:4px 12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:20px;transition:background .15s;user-select:none;}
.file-status:hover{background:rgba(255,255,255,.18);}
.file-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;transition:background .3s;}
.file-dot.loaded{background:#4ade80;}
.file-dot.empty{background:#6b7280;}
.file-status-label{font-size:11px;font-weight:600;color:#fff;white-space:nowrap;}
</style>
</head>

// ── File import & localStorage override ─────────────────
(function(){
  var STORAGE_KEY = 'se_q_targets_csv';
  var META_KEY    = 'se_q_targets_meta';

  // Keep clean copy of original embedded data
  var D_BASE = JSON.parse(JSON.stringify(D));

  function mergeCSV(base, overlay) {
    var result = JSON.parse(JSON.stringify(base));
    Object.keys(overlay).forEach(function(t) {
      if (!result[t]) result[t] = {};
      Object.keys(overlay[t]).forEach(function(c) {
        if (!result[t][c]) result[t][c] = {};
        Object.keys(overlay[t][c]).forEach(function(city) {
          result[t][c][city] = overlay[t][c][city];
        });
      });
    });
    return result;
  }

  function updateIndicator(){
    var meta = JSON.parse(localStorage.getItem(META_KEY)||'null');
    var dot   = document.getElementById('file-dot');
    var label = document.getElementById('file-status-label');
    if(meta){
      dot.className   = 'file-dot loaded';
      label.textContent = 'Import Targets · ' + meta.date;
    } else {
      dot.className   = 'file-dot loaded';
      label.textContent = 'Import Targets · 19/05/2026';
    }
  }

  // On load: if CSV saved, merge into D_BASE
  var saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    try{ D = mergeCSV(D_BASE, JSON.parse(saved)); }
    catch(e){ localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(META_KEY); }
  }


  document.getElementById('file-input').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try {
        var newD = parseCSV(ev.target.result);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(newD));
        var now = new Date();
        var dateStr = now.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'});
        localStorage.setItem(META_KEY, JSON.stringify({name: file.name.replace('.csv',''), date: dateStr}));
        D = mergeCSV(D_BASE, newD);
        updateIndicator();
        updateCityDropdown();
        render();
      } catch(err){
        alert('Error al parsear el CSV: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  function parseCSV(text) {
    var ZEROS = Array(12).fill(0);
    var METRIC_MAP = {
      'GMV': 'GMV',
      'No. of rides/orders': 'Rides',
      'EBITDA (without overhead)': 'EBITDA',
      'Net Rate': 'NetRate'
    };
    var result = {};
    // Handle both \r\n and \n line endings
    var dataLines = text.replace(/\r/g, '').split('\n').slice(3);
    dataLines.forEach(function(line) {
      if (!line.trim()) return;
      var cols = line.split(',');
      if (cols.length < 18) return;
      var target  = (cols[1]||'').trim();
      var city    = (cols[2]||'').trim();
      var country = (cols[3]||'').trim();
      var metric  = (cols[4]||'').trim();
      if (!target || !city || !country) return;
      if (!METRIC_MAP[metric]) return;
      var key = METRIC_MAP[metric];
      var vals = [];
      for (var i = 6; i <= 17; i++) {
        var v = parseFloat(cols[i]);
        vals.push(isNaN(v) ? 0 : v);
      }
      if (!result[target]) result[target] = {};
      if (!result[target][country]) result[target][country] = {};
      if (!result[target][country][city]) result[target][country][city] = {};
      result[target][country][city][key] = vals;
    });
    // Ensure every city has all 5 metrics; fill missing with zeros; calculate ASP
    Object.keys(result).forEach(function(target) {
      Object.keys(result[target]).forEach(function(country) {
        Object.keys(result[target][country]).forEach(function(city) {
          var c = result[target][country][city];
          if (!c.GMV)     c.GMV     = ZEROS.slice();
          if (!c.Rides)   c.Rides   = ZEROS.slice();
          if (!c.EBITDA)  c.EBITDA  = ZEROS.slice();
          if (!c.NetRate) c.NetRate = ZEROS.slice();
          c.ASP = c.GMV.map(function(g, i) {
            return c.Rides[i] > 0 ? parseFloat((g / c.Rides[i]).toFixed(4)) : 0;
          });
        });
      });
    });
    return result;
  }

  updateIndicator();
})();

// ── Aggregation helpers ─────────────────────────────────
function getCities(target, country) {
  if (!country) return null; // all countries
  return Object.keys(D[target][country]);
}

function aggregateCities(target, country, cities) {
  // cities: array of city names under a country
  // returns {GMV:[12], Rides:[12], EBITDA:[12], NetRate:[12], ASP:[12]}
  let gmv = Array(12).fill(0), rides = Array(12).fill(0), ebitda = Array(12).fill(0);
  let netrate_num = Array(12).fill(0); // gmv*netrate per month
  for (let city of cities) {
    let cd = D[target] && D[target][country] && D[target][country][city];
    if (!cd) continue;
    for (let m=0;m<12;m++) {
      gmv[m] += cd.GMV[m];
      rides[m] += cd.Rides[m];
      ebitda[m] += cd.EBITDA[m];
      netrate_num[m] += cd.GMV[m] * cd.NetRate[m];
    }
  }
  let netrate = gmv.map((g,i) => g>0 ? netrate_num[i]/g : 0);
  let asp = gmv.map((g,i) => rides[i]>0 ? g/rides[i] : 0);
  return {GMV:gmv, Rides:rides, EBITDA:ebitda, NetRate:netrate, ASP:asp};
}

function aggregateCountries(target, countries) {
  // returns {GMV:[12], ...}
  let gmv = Array(12).fill(0), rides = Array(12).fill(0), ebitda = Array(12).fill(0);
  let netrate_num = Array(12).fill(0);
  for (let country of countries) {
    if (!D[target] || !D[target][country]) continue;
    let cities = Object.keys(D[target][country]);
    let agg = aggregateCities(target, country, cities);
    for (let m=0;m<12;m++) {
      gmv[m] += agg.GMV[m];
      rides[m] += agg.Rides[m];
      ebitda[m] += agg.EBITDA[m];
      netrate_num[m] += agg.GMV[m] * agg.NetRate[m];
    }
  }
  let netrate = gmv.map((g,i) => g>0 ? netrate_num[i]/g : 0);
  let asp = gmv.map((g,i) => rides[i]>0 ? g/rides[i] : 0);
  return {GMV:gmv, Rides:rides, EBITDA:ebitda, NetRate:netrate, ASP:asp};
}

function sumMetric(arr) { return arr.reduce((a,b)=>a+b,0); }
function avgMetric(arr) { return arr.reduce((a,b)=>a+b,0)/arr.length; }

function annualKPI(data, metric) {
  if (metric==='GMV'||metric==='Rides'||metric==='EBITDA') return sumMetric(data[metric]);
  if (metric==='ASP') return sumMetric(data.GMV)/sumMetric(data.Rides);
  if (metric==='NetRate') return sumMetric(data.GMV.map((g,i)=>g*data.NetRate[i]))/sumMetric(data.GMV);
  return 0;
}

function periodicKPI(data, metric, months) {
  if (metric==='GMV'||metric==='Rides'||metric==='EBITDA')
    return months.reduce((s,m)=>s+data[metric][m],0);
  if (metric==='ASP') {
    let g=months.reduce((s,m)=>s+data.GMV[m],0), r=months.reduce((s,m)=>s+data.Rides[m],0);
    return r>0?g/r:0;
  }
  if (metric==='NetRate') {
    let g=months.reduce((s,m)=>s+data.GMV[m],0);
    let nr_num=months.reduce((s,m)=>s+data.GMV[m]*data.NetRate[m],0);
    return g>0?nr_num/g:0;
  }
  return 0;
}

// ── Formatting ──────────────────────────────────────────
function fmtGMV(v) {
  if(Math.abs(v)>=1e6) return '€'+(v/1e6).toFixed(2)+'M';
  if(Math.abs(v)>=1e3) return '€'+(v/1e3).toFixed(1)+'K';
  return '€'+v.toFixed(0);
}
function fmtRides(v) {
  if(Math.abs(v)>=1e6) return (v/1e6).toFixed(2)+'M';
  if(Math.abs(v)>=1e3) return (v/1e3).toFixed(1)+'K';
  return v.toFixed(0);
}
function fmtASP(v) { return '€'+v.toFixed(2); }
function fmtNetRate(v) { return (v*100).toFixed(2)+'%'; }
function fmtEBITDA(v) {
  if(Math.abs(v)>=1e6) return '€'+(v/1e6).toFixed(2)+'M';
  if(Math.abs(v)>=1e3) return '€'+(v/1e3).toFixed(1)+'K';
  return '€'+v.toFixed(0);
}
function fmtMetric(metric, v) {
  if(metric==='GMV') return fmtGMV(v);
  if(metric==='Rides') return fmtRides(v);
  if(metric==='ASP') return fmtASP(v);
  if(metric==='NetRate') return fmtNetRate(v);
  if(metric==='EBITDA') return fmtEBITDA(v);
}
function fmtDelta(metric, va, vb) {
  let d=vb-va;
  let pct = va!==0 ? (d/Math.abs(va)*100) : 0;
  let pos = d>0;
  // for EBITDA delta direction is nuanced but we follow: green when B>A
  return {val: (pos?'+':'')+fmtMetric(metric,d), pct:(pos?'+':'')+pct.toFixed(1)+'%', pos};
}

// ── Get current selection data ──────────────────────────
function getSelectionData(target) {
  let {country, city} = state;
  if (!country) {
    return { type:'all-countries', data: aggregateCountries(target, getActiveCountries()) };
  }
  if (!city) {
    if (!D[target] || !D[target][country]) return { type:'country', data:{GMV:Array(12).fill(0),Rides:Array(12).fill(0),EBITDA:Array(12).fill(0),NetRate:Array(12).fill(0),ASP:Array(12).fill(0)} };
    let cities = Object.keys(D[target][country]);
    return { type:'country', data: aggregateCities(target, country, cities) };
  }
  if (!D[target] || !D[target][country] || !D[target][country][city]) return { type:'city', data:{GMV:Array(12).fill(0),Rides:Array(12).fill(0),EBITDA:Array(12).fill(0),NetRate:Array(12).fill(0),ASP:Array(12).fill(0)} };
  let cd = D[target][country][city];
  // compute ASP and NetRate (NetRate stored as fraction)
  let asp = cd.GMV.map((g,i)=>cd.Rides[i]>0?g/cd.Rides[i]:0);
  return { type:'city', data:{...cd, ASP:asp} };
}

function getChartLines(target) {
  let {country, city} = state;
  // returns array of {label, data:[12]}
  if (!country) {
    return getActiveCountries().map(c => ({
      label: c,
      data: null // will be filled per metric
    }));
  }
  if (!city) {
    let cities = Object.keys(D[target][country]);
    return cities.map(c => ({label:c, data:null}));
  }
  return [{label: city, data:null}];
}

  cities.forEach(c => {
    let o = document.createElement('option');
    o.value = c; o.textContent = c;
    if(c===state.city) o.selected=true;
    sel.appendChild(o);
  });
  if(!state.city) sel.value = '';
}

// ── Compare pills: disable same as target ───────────────
function updateComparePills() {
  document.querySelectorAll('#pills-compare .pill').forEach(p => {
    let v = p.dataset.v;
    if(v && v===state.target) {
      p.disabled=true; p.style.opacity='.35'; p.style.cursor='not-allowed';
      if(state.compare===v){state.compare=''; renderCompareActive();}
    } else {
      p.disabled=false; p.style.opacity=''; p.style.cursor='';
    }
  });
}

function renderCompareActive() {
  document.querySelectorAll('#pills-compare .pill').forEach(p=>{
    p.classList.toggle('compare-active', p.dataset.v===state.compare);
  });
}

// ── Charts ──────────────────────────────────────────────
let charts = {};

function destroyChart(id) {
  if(charts[id]){charts[id].destroy();delete charts[id];}
}

function buildChartDatasets(metric, target, compare) {
  let {country, city} = state;
  let datasets = [];

  if(compare) {
    // Always 2 aggregate lines
    let da = getSelectionData(target).data;
    let db = getSelectionData(compare).data;
    datasets.push({
      label: target,
      data: da[metric],
      borderColor:'#0C2C1C',
      backgroundColor:'transparent',
      borderWidth:2.5,
      pointRadius:3,
      tension:.35
    });
    datasets.push({
      label: compare,
      data: db[metric],
      borderColor:'#2A9C64',
      backgroundColor:'transparent',
      borderWidth:2.5,
      pointRadius:3,
      tension:.35
    });
  } else {
    // Multi-line
    if(!country) {
      if(state.region) {
        // Single aggregated line for the region
        let agg = aggregateCountries(target, getActiveCountries());
        datasets.push({
          label: state.region,
          data: agg[metric],
          borderColor:'#2A9C64',
          backgroundColor:'transparent',
          borderWidth:2.5,
          pointRadius:3,
          tension:.35
        });
      } else {
        // Single aggregated line for all countries
        let agg = aggregateCountries(target, getActiveCountries());
        datasets.push({
          label: 'All',
          data: agg[metric],
          borderColor:'#2A9C64',
          backgroundColor:'transparent',
          borderWidth:2.5,
          pointRadius:3,
          tension:.35
        });
      }
    } else if(!city) {
      if (!D[target] || !D[target][country]) return datasets;
      let agg = aggregateCities(target, country, Object.keys(D[target][country]));
      datasets.push({
        label: country,
        data: agg[metric],
        borderColor:'#2A9C64',
        backgroundColor:'transparent',
        borderWidth:2.5,
        pointRadius:3,
        tension:.35
      });
    } else {
      if (!D[target] || !D[target][country] || !D[target][country][city]) return datasets;
      let cd = D[target][country][city];
      let vals;
      if(metric==='ASP') vals=cd.GMV.map((g,m)=>cd.Rides[m]>0?g/cd.Rides[m]:0);
      else if(metric==='NetRate') vals=cd.NetRate;
      else vals=cd[metric];
      datasets.push({
        label:city,
        data:vals,
        borderColor:'#2A9C64',
        backgroundColor:'transparent',
        borderWidth:2.5,
        pointRadius:3,
        tension:.35
      });
    }
  }
  return datasets;
}

function tickFmt(metric, v) {
  if(metric==='GMV'||metric==='EBITDA') return v>=1e6?(v/1e6).toFixed(1)+'M':(v/1e3).toFixed(0)+'K';
  if(metric==='Rides') return v>=1e6?(v/1e6).toFixed(1)+'M':(v/1e3).toFixed(0)+'K';
  if(metric==='ASP') return '€'+v.toFixed(1);
  if(metric==='NetRate') return (v*100).toFixed(1)+'%';
  return v;
}


// ── Custom plugin: Proj. marker + gap % labels ──────────────────────────────
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
const dashboardPlugin = {
  id: 'dashboardAnnotations',
  afterDraw(chart) {
    try {
      const ctx  = chart.ctx;
      const xSc  = chart.scales.x;
      const ySc  = chart.scales.y;
      const area = chart.chartArea;
      if (!xSc || !ySc) return;

      // ── Proj. badge inside chart area (above x-axis) ──────────────────────
      if (CURRENT_MONTH >= 0) {
        const xProj = xSc.getPixelForIndex(CURRENT_MONTH);
        ctx.save();
        const bw = 30, bh = 13;
        const bx = xProj - bw/2, by = area.bottom - 16;
        ctx.fillStyle = 'rgba(245,158,11,0.18)';
        rrect(ctx, bx, by, bw, bh, 3);
        ctx.fill();
        ctx.fillStyle = '#b45309';
        ctx.font = 'bold 8px Inter';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Proj.', xProj, by + bh/2);
        ctx.restore();
      }

      // ── % gap labels between the two compared targets ──────────────────────
      const ds  = chart.data.datasets;
      const n   = ds.length;
      if (n < 2 || n % 2 !== 0) return;
      const half  = n / 2;
      const mtype = chart.options.metricType || '';
      const isAvg = (mtype === 'ASP' || mtype === 'NetRate');
      if (isAvg && half > 1) return;

      // Fixed row at top of chart area so labels are always visible
      const ROW_Y = area.top + 14;   // pill bottom edge
      const PILL_H = 13;

      ctx.save();
      ctx.font = 'bold 8px Inter';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';

      for (let i = 0; i < 12; i++) {
        let sumA = 0, sumB = 0, hasA = false;
        for (let d = 0; d < half; d++) {
          const va = ds[d].data[i];
          const vb = ds[d + half].data[i];
          if (va != null) { sumA += va; hasA = true; }
          if (vb != null)   sumB += vb;
        }
        if (!hasA || sumA === 0) continue;

        let txt, pos;
        if (mtype === 'NetRate') {
          const pp = (sumB - sumA) * 100;
          pos = pp >= 0;
          txt = (pos ? '+' : '') + pp.toFixed(1) + 'pp';
        } else if (mtype === 'ASP') {
          const diff = sumB - sumA;
          pos = diff >= 0;
          txt = (pos ? '+€' : '-€') + Math.abs(diff).toFixed(2);
        } else {
          const pct = (sumB - sumA) / Math.abs(sumA) * 100;
          pos = pct >= 0;
          txt = (pos ? '+' : '') + pct.toFixed(1) + '%';
        }

        const x  = xSc.getPixelForIndex(i);
        const tw = ctx.measureText(txt).width + 7;

        ctx.fillStyle = pos ? '#dcfce7' : '#fee2e2';
        rrect(ctx, x - tw/2, ROW_Y - PILL_H, tw, PILL_H, 3);
        ctx.fill();
        // border
        ctx.strokeStyle = pos ? '#86efac' : '#fca5a5';
        ctx.lineWidth = 0.8;
        rrect(ctx, x - tw/2, ROW_Y - PILL_H, tw, PILL_H, 3);
        ctx.stroke();

        ctx.fillStyle = pos ? '#15803d' : '#b91c1c';
        ctx.fillText(txt, x, ROW_Y);
      }
      ctx.restore();
    } catch(e) { /* never break chart render */ }
  }
};

function renderChart(metric) {
  let box = document.getElementById('box-'+metric);
  let active = state.metrics.has(metric);
  box.classList.toggle('hidden', !active);
  if(!active){destroyChart(metric);return;}

  let datasets = buildChartDatasets(metric, state.target, state.compare);
  let canvas = document.getElementById('chart-'+metric);
  destroyChart(metric);

  let showLegend = datasets.length > 1 && datasets.length <= 15;

  charts[metric] = new Chart(canvas, {
    type:'line',
    data:{labels:MONTHS, datasets},
    plugins:[dashboardPlugin],
    options:{
      responsive:true,
      maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      layout:{padding:{bottom:20}},
      metricType: metric,
      plugins:{
        legend:{display:showLegend, position:'bottom', labels:{
          font:{family:'Inter',size:10,weight:'500'},
          usePointStyle:true, pointStyleWidth:8, boxHeight:6,
          color:'#000', padding:8
        }},
        tooltip:{
          callbacks:{
            label: ctx => {
              let s = ` ${ctx.dataset.label}: ${tickFmt(metric, ctx.parsed.y)}`;
              // add gap % in tooltip when 2 datasets
              if(ctx.chart.data.datasets.length===2 && ctx.datasetIndex===1){
                const v0=ctx.chart.data.datasets[0].data[ctx.dataIndex];
                const v1=ctx.parsed.y;
                if(v0){const p=(v1-v0)/Math.abs(v0)*100; s+=' ('+(p>=0?'+':'')+p.toFixed(1)+'%)';}
              }
              return s;
            }
          }
        }
      },
      scales:{
        x:{grid:{color:'#f0f0f0'},ticks:{font:{family:'Inter',size:10},
          color: (c)=>c.index===CURRENT_MONTH?'#b45309':'#555',
          callback: (val,index)=>{
            const m=MONTHS[index]||String(val);
            if(CURRENT_MONTH >= 0 && index===CURRENT_MONTH) return [m,'▲ Proj.'];
            return m;
          }
        }},
        y:{grid:{color:'#f0f0f0'},ticks:{font:{family:'Inter',size:10},color:'#555',
          callback: v=>tickFmt(metric,v)
        }}
      }
    }
  });
}

function renderAllCharts() {
  METRICS.forEach(m=>renderChart(m));
}

// ── KPI Cards ───────────────────────────────────────────
function renderKPIs() {
  let {target,compare,metrics} = state;
  let da = getSelectionData(target).data;

  // Use last month with data: CURRENT_MONTH if valid, else Dec (11)
  const lastM = (CURRENT_MONTH >= 0) ? CURRENT_MONTH : 11;
  const monthLabel = MONTHS[lastM] + (CURRENT_MONTH >= 0 ? ' (Proj.)' : '');
  const mlEl = document.getElementById('kpi-month-label');
  if(mlEl) mlEl.textContent = monthLabel;

  METRICS.forEach(m=>{
    let card = document.getElementById('kpi-'+m);
    card.classList.toggle('hidden', !metrics.has(m));
    if(!metrics.has(m)) return;

    let valEl = document.getElementById('kpi-'+m+'-val');
    let cmpEl = document.getElementById('kpi-'+m+'-cmp');
    let va = periodicKPI(da, m, [lastM]);

    if(!compare) {
      valEl.textContent = fmtMetric(m, va);
      cmpEl.innerHTML = '';
    } else {
      let db = getSelectionData(compare).data;
      let vb = periodicKPI(db, m, [lastM]);
      let {val,pct,pos} = fmtDelta(m,va,vb);
      valEl.textContent = '';
      cmpEl.innerHTML = `
        <span class="kpi-a">${fmtMetric(m,va)}</span>
        <span style="color:#aaa;font-size:12px">→</span>
        <span class="kpi-b">${fmtMetric(m,vb)}</span>
        <span class="kpi-delta ${pos?'pos':'neg'}">${val} (${pct})</span>
      `;
    }
  });
}

// ── Table ───────────────────────────────────────────────
function getTableRows(target) {
  let {country, city} = state;
  let rows = [];
  const EMPTY = {GMV:Array(12).fill(0),Rides:Array(12).fill(0),EBITDA:Array(12).fill(0),NetRate:Array(12).fill(0),ASP:Array(12).fill(0)};
  if(!country) {
    getActiveCountries().forEach(c=>{
      if (!D[target] || !D[target][c]) return;
      let cities=Object.keys(D[target][c]);
      rows.push({label:c, data:aggregateCities(target,c,cities)});
    });
  } else if(!city) {
    if (!D[target] || !D[target][country]) return rows;
    let cities=Object.keys(D[target][country]);
    cities.forEach(c=>{
      let cd=D[target][country][c];
      if (!cd) return;
      let asp=cd.GMV.map((g,m)=>cd.Rides[m]>0?g/cd.Rides[m]:0);
      rows.push({label:c, data:{...cd,ASP:asp}});
    });
  } else {
    if (!D[target] || !D[target][country] || !D[target][country][city]) return rows;
    let cd=D[target][country][city];
    let asp=cd.GMV.map((g,m)=>cd.Rides[m]>0?g/cd.Rides[m]:0);
    rows.push({label:city, data:{...cd,ASP:asp}});
  }
  return rows;
}

function getTotalRow(rows, metrics, periods) {
  // aggregate total
  let tot = {};
  METRICS.forEach(m=>{
    if(m==='GMV'||m==='Rides'||m==='EBITDA'){
      tot[m]=Array(12).fill(0);
      rows.forEach(r=>{for(let i=0;i<12;i++) tot[m][i]+=r.data[m][i];});
    }
  });
  // ASP and NetRate need GMV-weighted from original
  tot.ASP=tot.GMV.map((g,i)=>tot.Rides[i]>0?g/tot.Rides[i]:0);
  // for NetRate we need weighted; but we only have aggregated data here
  // re-aggregate from raw rows using GMV*NetRate approach:
  // Actually rows already contain aggregated city data so NetRate in row.data is already weighted
  // We re-aggregate rows using GMV*NetRate:
  let nr_num=Array(12).fill(0), gmv_=Array(12).fill(0);
  rows.forEach(r=>{
    for(let i=0;i<12;i++){
      gmv_[i]+=r.data.GMV[i];
      nr_num[i]+=r.data.GMV[i]*r.data.NetRate[i];
    }
  });
  tot.NetRate=gmv_.map((g,i)=>g>0?nr_num[i]/g:0);
  return tot;
}

function getPeriods() {
  if(state.view==='anual') return [{label:'Annual', months:Array.from({length:12},(_,i)=>i)}];
  if(state.view==='trim') return QUARTERS.map((q,i)=>({label:q, months:Q_MONTHS[i]}));
  return MONTHS.map((m,i)=>({label:m, months:[i]}));
}

function renderTable() {
  let {target,compare,metrics,view} = state;
  let rows_a = getTableRows(target);
  let rows_b = compare ? getTableRows(compare) : null;
  let periods = getPeriods();
  let selMetrics = METRICS.filter(m=>metrics.has(m));
  let container = document.getElementById('tbl-container');

  let colCount = compare
    ? selMetrics.length * 3 * periods.length + 1
    : selMetrics.length * periods.length + 1;

  let thead = '<thead><tr><th rowspan="2" style="text-align:left">Entity</th>';

  if(compare) {
    periods.forEach(p=>{
      thead += `<th colspan="${selMetrics.length}" class="th-a">${p.label} · ${target}</th>`;
      thead += `<th colspan="${selMetrics.length}" class="th-b">${p.label} · ${compare}</th>`;
      thead += `<th colspan="${selMetrics.length}" class="th-d">${p.label} · Δ</th>`;
    });
    thead += '</tr><tr>';
    periods.forEach(p=>{
      [target,compare,'Δ'].forEach(t=>{
        selMetrics.forEach(m=>{
          let cls = t===target?'th-a':t===compare?'th-b':'th-d';
          thead+=`<th class="${cls}">${m}</th>`;
        });
      });
    });
  } else {
    periods.forEach(p=>{
      thead += `<th colspan="${selMetrics.length}">${p.label}</th>`;
    });
    thead += '</tr><tr>';
    periods.forEach(p=>{
      selMetrics.forEach(m=>{
        thead+=`<th>${m}</th>`;
      });
    });
  }
  thead += '</tr></thead>';

  function rowHtml(label, data_a, data_b, isTot) {
    let cls = isTot ? ' class="total-row"' : '';
    let html = `<tr${cls}><td>${label}</td>`;
    periods.forEach(p=>{
      if(compare) {
        selMetrics.forEach(m=>{
          let va=periodicKPI(data_a,m,p.months);
          html+=`<td>${fmtMetric(m,va)}</td>`;
        });
        selMetrics.forEach(m=>{
          let vb=periodicKPI(data_b,m,p.months);
          html+=`<td>${fmtMetric(m,vb)}</td>`;
        });
        selMetrics.forEach(m=>{
          let va=periodicKPI(data_a,m,p.months);
          let vb=periodicKPI(data_b,m,p.months);
          let d=vb-va;
          let pos=d>0;
          html+=`<td class="${pos?'delta-pos':'delta-neg'}">${pos?'+':''}${fmtMetric(m,d)}</td>`;
        });
      } else {
        selMetrics.forEach(m=>{
          let va=periodicKPI(data_a,m,p.months);
          html+=`<td>${fmtMetric(m,va)}</td>`;
        });
      }
    });
    html+='</tr>';
    return html;
  }

  let tot_a = getTotalRow(rows_a, selMetrics, periods);
  let tot_b = compare ? getTotalRow(rows_b, selMetrics, periods) : null;

  let tbody = '<tbody>';
  rows_a.forEach((r,i)=>{
    let rb = rows_b ? rows_b[i] : null;
    tbody += rowHtml(r.label, r.data, rb?rb.data:null, false);
  });
  tbody += rowHtml('TOTAL', tot_a, tot_b, true);
  tbody += '</tbody>';

  container.innerHTML = `<table>${thead}${tbody}</table>`;
}

// ── Full render ─────────────────────────────────────────
function render() {
  updateChips();
  renderKPIs();
  renderAllCharts();
  renderTable();
}

// ── Event listeners ─────────────────────────────────────
document.getElementById('sel-region').addEventListener('change', e=>{
  state.region = e.target.value;
  state.country = '';
  state.city = '';
  updateCountryDropdown();
  updateCityDropdown();
  render();
});

document.getElementById('sel-country').addEventListener('change', e=>{
  state.country = e.target.value;
  state.city = '';
  updateCityDropdown();
  render();
});

document.getElementById('sel-city').addEventListener('change', e=>{
  state.city = e.target.value;
  render();
});

document.querySelectorAll('#pills-target .pill').forEach(p=>{
  p.addEventListener('click',()=>{
    state.target=p.dataset.v;
    document.querySelectorAll('#pills-target .pill').forEach(x=>x.classList.toggle('active',x===p));
    // if compare is same as new target, clear it
    if(state.compare===state.target){
      state.compare='';
      renderCompareActive();
    }
    // refresh city dropdown — Actuals may have different cities than budget targets
    updateCityDropdown();
    updateComparePills();
    render();
  });
});

document.querySelectorAll('#pills-compare .pill').forEach(p=>{
  p.addEventListener('click',()=>{
    if(p.disabled) return;
    state.compare=p.dataset.v;
    renderCompareActive();
    render();
  });
});

document.querySelectorAll('#pills-metrics .pill').forEach(p=>{
  p.addEventListener('click',()=>{
    let m=p.dataset.m;
    if(state.metrics.has(m)) {
      if(state.metrics.size===1) return; // keep at least 1
      state.metrics.delete(m);
      p.classList.remove('metric-active');
    } else {
      state.metrics.add(m);
      p.classList.add('metric-active');
    }
    render();
  });
});

['anual','trim','men'].forEach(v=>{
  document.getElementById('vp-'+v).addEventListener('click',()=>{
    state.view=v;
    ['anual','trim','men'].forEach(x=>document.getElementById('vp-'+x).classList.toggle('active',x===v));
    renderTable();
  });
});

  const el = document.getElementById('last-update-label');
  if(el && typeof LAST_ACTUALS_UPDATE !== 'undefined')
    el.textContent = 'Actuals last updated: ' + LAST_ACTUALS_UPDATE;
  else if(el) el.textContent = 'Actuals: not yet loaded';
})();
updateCountryDropdown();
updateCityDropdown();
updateComparePills();
render();
